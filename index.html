<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Memory Monsters — Охота за парами</title>
  <link rel="stylesheet" href="css/style.css?v=20260813-5">
</head>
<body>
  <div class="doodle d1">✦</div><div class="doodle d2">○</div><div class="doodle d3">⌁</div>
  <main id="app">
    <section id="home" class="screen active">
      <header class="brand"><span class="eyebrow">ДОБРАЯ ИГРА НА ПАМЯТЬ</span><h1>MEMORY<br><i>MONSTERS</i></h1><p>Собери всех чудиков по парам!</p></header>
      <div class="hero-card"><div class="hero-art back-art"></div><span class="bubble">Сыграем?</span></div>
      <div class="menu-card">
        <h2>Кто сегодня играет?</h2>
        <div class="mode-grid">
          <button class="mode" data-players="1"><b>1</b><span>С компьютером</span></button>
          <button class="mode selected" data-players="2"><b>2</b><span>Вдвоём</span></button>
          <button class="mode" data-players="3"><b>3</b><span>Втроём</span></button>
          <button class="mode" data-players="4"><b>4</b><span>Вчетвером</span></button>
        </div>
        <div class="rule-switch"><button class="rule selected" data-rule="classic">По очереди</button><button class="rule" data-rule="streak">До ошибки</button></div>
        <button id="soloBtn" class="solo-mode">SOLO · НА ВРЕМЯ</button>
        <div id="playerSetup"></div>
        <button id="startBtn" class="primary">ИГРАТЬ <span>→</span></button>
        <div class="leader-buttons"><button class="text-btn" data-modal="leaders">🏆 Лучшие игроки</button><button class="text-btn" data-modal="soloLeaders">⏱ Рекорды соло</button></div>
      </div>
    </section>

    <section id="game" class="screen">
      <header class="game-head"><div class="game-logo"><b>MEMORY</b><i>MONSTERS</i></div><div></div><div class="tools"><button id="fullscreenBtn" class="icon-btn fullscreen-btn" aria-label="На весь экран" title="На весь экран">⛶</button><button class="icon-btn" data-modal="rules" aria-label="Правила">?</button><div class="music-control"><button id="soundBtn" class="icon-btn" aria-label="Настройки звука">♫</button><div class="volume-pop"><label for="musicVolume"><span>♫</span> Музыка</label><input id="musicVolume" type="range" min="0" max="100" value="24"><label for="sfxVolume"><span>✦</span> Звуки игры</label><input id="sfxVolume" type="range" min="0" max="100" value="65"></div></div><button id="restartBtn" class="icon-btn">↻</button><button id="exitBtn" class="icon-btn">×</button></div></header>
      <div class="special-dock"><div class="special-heading"><small>МАГИЧЕСКАЯ ПОЛКА</small><b>Особые карты</b></div><div id="specialSlots"><span data-label="Мегарэмза">М</span><span data-label="КактуРем">К</span></div></div>
      <div class="game-layout"><aside id="playersLeft" class="players"></aside><div class="board-column"><div id="board" class="board" aria-label="Игровое поле"></div><div class="turn-panel"><b id="turnText">Ход игрока</b><strong id="soloTimer" hidden>00:00</strong></div></div><aside id="playersRight" class="players"></aside><aside id="soloPanel" class="solo-panel"><div class="timer-monster"><img src="assets/avatars/solo-timer-monster.png" alt="Весёлый монстр-таймер"><div class="timer-belly"><small>ВРЕМЯ ОХОТЫ</small><strong id="soloSideTimer">00:00</strong><b id="soloPlayerName">Матвей</b><em>Найди всех!</em></div></div></aside></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <div id="modal" class="overlay" aria-hidden="true"><div class="modal"><button id="closeModal" class="modal-close">×</button><div id="modalBody"></div></div></div>
  <div id="confetti"></div>
  <div id="rotatePrompt"><div class="rotate-phone">↻</div><b>Поверни устройство</b><span>Монстрики лучше играют горизонтально!</span></div>
  <audio id="bgMusic" src="assets/audio/public_music_2.mp3" loop preload="auto"></audio>
  <script src="js/game.js?v=20260813-5"></script>
</body>
</html>
